#
# Xiaomi Mi MIX 2 (chiron) -- Qualcomm MSM8998
#
# base/size match Platforms/Xiaomi/chironPkg/chiron.fdf [Defines] FD_BASE/FD_SIZE,
# and must also match FD_BASE in hackios-xnu-kernel/common/devices/chiron.conf:
# the boot shim puts this image at that address.
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x9FD00000
size = 0x200000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# header_version 2: msm8998's bootloader (2017) predates v4.
# redwood (2022) uses 1; the 9707f sample uses 4. Neither fits a 2017 phone.
#
[boot_image]
header_version = 2
