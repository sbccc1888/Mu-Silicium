#
# Xiaomi Mi MIX 2 (chiron) -- Qualcomm MSM8998
#
# base/size match Platforms/Xiaomi/chironPkg/chiron.fdf [Defines] FD_BASE/FD_SIZE,
# and must also match FD_BASE in hackios-xnu-kernel/common/devices/chiron.conf:
# the boot shim puts this image at that address.
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0x9FC00000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# header_version = 1, the same as cheeseburger -- the OnePlus 5 on this very SoC.
# That is the bootloader generation chiron has, and v1 takes the DTB appended to the
# kernel (append_dtb above) instead of in its own header field.
#
# This was 2, taken from another device's comment rather than from a phone with
# msm8998. At version > 1 mkbootimg requires a non-empty --dtb argument that
# build_uefi.py never passes, so the build stopped at "DTB image must not be empty"
# after the firmware itself had already built and verified.
#
[boot_image]
header_version = 1
